# Ana · vendedora de IA da equipe da Wan (versão 7cad0c63f9fb). Gerado por scripts/gerar-compose.mjs.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ana
      POSTGRES_PASSWORD: ${DB_SENHA}
      POSTGRES_DB: ana
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ana -d ana"]
      interval: 5s
      timeout: 5s
      retries: 20

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: unless-stopped
    environment:
      ASR_MODEL: small
      ASR_ENGINE: faster_whisper
    volumes:
      - whisper:/root/.cache

  ana:
    image: node:22-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: America/Sao_Paulo
      ANA_VERSAO: "7cad0c63f9fb"
      BASE_URL: https://ana.salgadeiro.shop
      DATABASE_URL: postgres://ana:${DB_SENHA}@db:5432/ana
      PAINEL_SENHA: ${PAINEL_SENHA}
      VERIFY_TOKEN: ${VERIFY_TOKEN}
      KIWIFY_SEGREDO: ${KIWIFY_SEGREDO}
      WHISPER_URL: http://whisper:9000
      PASTA_DADOS: /data
      APP_CHAVE: ${APP_CHAVE}
    configs:
      - source: codigo_ana
        target: /bundle/app.enc
      - source: decifrar
        target: /bundle/decifrar.cjs
    volumes:
      - anadata:/data
    working_dir: /
    command: ["sh", "-c", "node /bundle/decifrar.cjs && rm -rf /app && mkdir -p /app && tar xzf /tmp/app.tgz -C /app && cd /app && npm ci --omit=dev --no-audit --no-fund && exec node src/index.js"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - ana
    ports:
      - "80:80"
      - "443:443"
    command: ["caddy", "reverse-proxy", "--from", "ana.salgadeiro.shop", "--to", "ana:3000"]
    volumes:
      - caddydata:/data
      - caddyconfig:/config

configs:
  decifrar:
    content: |
      const c=require('crypto'),f=require('fs');const b=Buffer.from(f.readFileSync('/bundle/app.enc','utf8').replace(/\s+/g,''),'base64');const d=c.createDecipheriv('aes-256-gcm',Buffer.from(process.env.APP_CHAVE,'base64'),b.subarray(0,12));d.setAuthTag(b.subarray(b.length-16));f.writeFileSync('/tmp/app.tgz',Buffer.concat([d.update(b.subarray(12,b.length-16)),d.final()]));
